services:
  - type: web
    name: fortune-xuanjige
    runtime: node
    plan: free
    region: oregon
    installCommand: npm install && cd client && npm install
    buildCommand: cd client && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: SILICONFLOW_URL
        sync: false
      - key: SILICONFLOW_MODEL
        sync: false
      - key: JWT_SECRET
        sync: false
